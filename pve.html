<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PvE — OP-MAPS DATA</title>
<meta name="description" content="El PvE de OP-MAPS: 50 % de victoria, recompensas, ofertas de tripulante, tributos y lo que cuesta perder o hundirse.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="pve" data-title-key="title.pve">

<div id="site-header"></div>

<main>
  <div class="wrap">

    <header class="page-head">
      <h1 data-i18n="nav.pve">PvE</h1>
      <p data-i18n-html="pve.lead"></p>
    </header>

    <!-- lo que es igual en toda isla -->
    <section class="panel">
      <h2 data-i18n="pve.fixed">Las reglas del desembarco</h2>
      <div id="fijos"></div>
    </section>

    <!-- el combate concreto de cada isla -->
    <section class="panel">
      <h2 data-i18n="pve.isla.t">Combate al desembarcar</h2>
      <div class="pve-form">
        <label class="campo">
          <span data-i18n="pve.isla.sea">Mar</span>
          <select id="mar" class="isla-select"></select>
        </label>
        <label class="campo campo-ancho">
          <span data-i18n="pve.isla.pick">Elige la isla</span>
          <!-- las opciones las rellena pve.js según el mar elegido -->
          <select id="isla" class="isla-select"></select>
        </label>
      </div>
      <div id="combate"></div>
      <p class="note" data-i18n-html="pve.isla.guide50"></p>
    </section>

    <!-- los tres desenlaces -->
    <div class="pve-cols">
      <section class="panel">
        <h2 data-i18n="pve.win.t">Si ganas</h2>
        <ul>
          <li data-i18n-html="pve.win.1"></li>
          <li data-i18n-html="pve.win.2"></li>
          <li data-i18n-html="pve.win.3"></li>
          <li data-i18n-html="pve.win.4"></li>
          <li data-i18n-html="pve.win.5"></li>
          <li data-i18n-html="pve.win.6"></li>
        </ul>
      </section>

      <section class="panel">
        <h2 data-i18n="pve.lose.t">Si pierdes y aguantas</h2>
        <ul>
          <li data-i18n-html="pve.lose.1"></li>
          <li data-i18n-html="pve.lose.2"></li>
          <li data-i18n-html="pve.lose.3"></li>
          <li data-i18n-html="pve.lose.4"></li>
          <li data-i18n-html="pve.lose.5"></li>
        </ul>
      </section>

      <section class="panel">
        <h2 data-i18n="pve.sink.t">Si pierdes y te hundes</h2>
        <ul>
          <li data-i18n-html="pve.sink.1"></li>
          <li data-i18n-html="pve.sink.2"></li>
          <li data-i18n-html="pve.sink.3"></li>
          <li data-i18n-html="pve.sink.4"></li>
          <li data-i18n-html="pve.sink.5"></li>
          <li data-i18n-html="pve.sink.6"></li>
          <li data-i18n-html="pve.sink.7"></li>
        </ul>
      </section>
    </div>

    <section class="panel">
      <h2 data-i18n="pve.down.t">Si no queda nadie en pie</h2>
      <p class="parrafo" data-i18n-html="pve.down.1"></p>
    </section>

    <section class="panel">
      <h2 data-i18n="pve.tips.t">Cómo sacarle más</h2>
      <ul>
        <li data-i18n-html="pve.tips.1"></li>
        <li data-i18n-html="pve.tips.2"></li>
        <li data-i18n-html="pve.tips.3"></li>
        <li data-i18n-html="pve.tips.4"></li>
      </ul>
    </section>

  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/characters.js"></script>
<script src="assets/js/islands.js"></script>
<script src="assets/js/rules.js"></script>
<script src="assets/js/crew-store.js"></script>
<script src="assets/js/pve.js"></script>
</body>
</html>
