<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PvE — OP-MAPS DATA</title>
<meta name="description" content="El PvE de OP-MAPS: las 156 islas con sus tres enemigos fijos, la probabilidad exacta de ganar en cada una y con qué alineación.">
<link rel="icon" href="assets/favicon.svg?v=1.9.2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=1.9.2">
</head>
<body data-page="pve" data-title-key="title.pve">

<div id="site-header"></div>

<main>
  <div class="wrap">

    <header class="page-head">
      <h1 data-i18n="nav.pve">PvE</h1>
      <p data-i18n-html="pve.lead"></p>
    </header>

    <!-- lo que es igual en toda isla -->
    <section class="panel">
      <h2 data-i18n="pve.fixed">Las reglas del desembarco</h2>
      <div id="fijos"></div>
    </section>

    <!-- el combate concreto de cada isla -->
    <section class="panel">
      <h2 data-i18n="pve.isla.t">Combate al desembarcar</h2>
      <div class="pve-form">
        <label class="campo">
          <span data-i18n="pve.isla.sea">Mar</span>
          <select id="mar" class="isla-select"></select>
        </label>
        <label class="campo campo-ancho">
          <span data-i18n="pve.isla.pick">Elige la isla</span>
          <!-- las opciones las rellena pve.js según el mar elegido -->
          <select id="isla" class="isla-select"></select>
        </label>
      </div>
      <div id="combate"></div>
    </section>

    <p class="note ver-guia" data-i18n-html="site.verGuia"></p>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/i18n.js?v=1.9.2"></script>
<script src="assets/js/site.js?v=1.9.2"></script>
<script src="assets/js/characters.js?v=1.9.2"></script>
<script src="assets/js/islands.js?v=1.9.2"></script>
<script src="assets/js/rules.js?v=1.9.2"></script>
<script src="assets/js/crew-store.js?v=1.9.2"></script>
<script src="assets/js/pve.js?v=1.9.2"></script>
</body>
</html>
