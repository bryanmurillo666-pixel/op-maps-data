<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jefes — OP-MAPS DATA</title>
<meta name="description" content="Simulador de los jefes del mundo de OP-MAPS: junta a varios jugadores con sus tres mejores y su táctica, y mira cuánto daño le hacéis a Mihawk o a Big Mom y cuánto tardáis en tumbarlo.">
<link rel="icon" href="assets/favicon.svg?v=1.13.0" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=1.13.0">
</head>
<body data-page="jefes" data-title-key="title.jefes">

<div id="site-header"></div>

<main>
  <div class="wrap">

    <header class="page-head">
      <h1 data-i18n="nav.jefes">Jefes</h1>
      <p data-i18n-html="jef.lead"></p>
    </header>

    <!-- contra quién: el jefe y cuántos ataques hace cada uno por turno -->
    <section class="panel">
      <h2 data-i18n="jef.boss.t">El jefe</h2>
      <div id="jefeElige"></div>
      <div id="jefeFicha"></div>
    </section>

    <!-- lo que sale de todo: arriba porque es lo que se viene a mirar -->
    <section class="panel">
      <h2 data-i18n="jef.res.t">Cuánto tardáis</h2>
      <div id="resultado"></div>
    </section>

    <!-- los jugadores -->
    <section class="panel">
      <div class="panel-head">
        <h2 data-i18n="jef.pl.t">Jugadores</h2>
        <span class="panel-count" id="jugCount"></span>
      </div>
      <div class="add-row">
        <input type="text" id="jugNombre" maxlength="24" autocomplete="off"
               data-i18n-attr="placeholder:jef.pl.ph; aria-label:jef.pl.ph">
        <button class="btn-add" id="jugAdd" type="button" data-i18n="jef.pl.add">Añadir jugador</button>
      </div>
      <div class="jef-atajos">
        <button class="btn-mini" id="jugMio" type="button" data-i18n="jef.pl.mine">Añadir mi tripulación</button>
        <button class="btn-mini" id="jugVaciar" type="button" data-i18n="jef.pl.clear">Quitar a todos</button>
      </div>
      <p class="hint" id="jugHint"></p>
      <div id="jugadores"></div>
    </section>

    <p class="note" data-i18n-html="jef.how"></p>
    <p class="note ver-guia" data-i18n-html="site.verGuia"></p>
  </div>
</main>

<div id="site-footer"></div>

<!-- nombres para el autocompletado, los rellena jefes.js -->
<datalist id="pjLista"></datalist>

<script src="assets/js/i18n.js?v=1.13.0"></script>
<script src="assets/js/site.js?v=1.13.0"></script>
<script src="assets/js/characters.js?v=1.13.0"></script>
<script src="assets/js/rules.js?v=1.13.0"></script>
<script src="assets/js/crew-store.js?v=1.13.0"></script>
<script src="assets/js/jefes.js?v=1.13.0"></script>
</body>
</html>
