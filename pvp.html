<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PvP — OP-MAPS DATA</title>
<meta name="description" content="El PvP de OP-MAPS: tu plan de ataque contra las guardias de un rival, y qué tres guardias montar tú para aguantar lo que te mande.">
<link rel="icon" href="assets/favicon.svg?v=1.9.5" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=1.9.5">
</head>
<body data-page="pvp" data-title-key="title.pvp">

<div id="site-header"></div>

<main>
  <div class="wrap">

    <header class="page-head">
      <h1 data-i18n="nav.pvp">PvP</h1>
      <p data-i18n="pvp.lead">El PvP son tres contra tres, posición contra posición: tu primero solo pelea con su primero. El poder total no decide nada.</p>
    </header>

    <!-- la libreta vive en Mis rivales; aquí solo se elige contra quién -->
    <section class="panel elige">
      <div class="pve-form">
        <!-- la alianza sólo aparece si hay alguna etiqueta que elegir -->
        <label class="campo" id="campoAlianza" hidden>
          <span data-i18n="pvp.plan.ali">Alianza</span>
          <select id="planAlianza" class="isla-select"></select>
        </label>
        <label class="campo campo-ancho">
          <span data-i18n="pvp.plan.pick">Contra quién</span>
          <select id="planRival" class="isla-select"></select>
        </label>
      </div>
      <p class="hint" data-i18n-html="pvp.riv.link"></p>
    </section>

    <!-- 2. cómo le ganas -->
    <details class="plegable" data-k="atq" open>
      <summary><h2 data-i18n="pvp.plan.t">Tu plan de ataque</h2></summary>
      <div class="plegable-body">
        <div class="modo-btns" role="group" data-i18n-attr="aria-label:pvp.plan.mode">
          <button type="button" class="modo on" data-modo="g30"
                  data-i18n="pvp.mk.g30">Ganar 3-0</button>
          <button type="button" class="modo" data-modo="g21"
                  data-i18n="pvp.mk.g21">Ganar 2-1</button>
          <button type="button" class="modo" data-modo="p12"
                  data-i18n="pvp.mk.p12">Perder 1-2</button>
          <button type="button" class="modo" data-modo="p03"
                  data-i18n="pvp.mk.p03">Perder 0-3</button>
        </div>
        <div id="resultado"></div>
      </div>
    </details>

    <!-- 3. cómo te defiendes de él -->
    <details class="plegable" data-k="def">
      <summary><h2 data-i18n="pvp.def.t">Tus guardias contra él</h2></summary>
      <div class="plegable-body">
        <p class="parrafo" data-i18n-html="pvp.def.d"></p>
        <div id="defensa"></div>
      </div>
    </details>


    <p class="note ver-guia" data-i18n-html="site.verGuia"></p>
  </div>
</main>

<div id="site-footer"></div>

<datalist id="db"></datalist>

<script src="assets/js/i18n.js?v=1.9.5"></script>
<script src="assets/js/site.js?v=1.9.5"></script>
<script src="assets/js/characters.js?v=1.9.5"></script>
<script src="assets/js/rules.js?v=1.9.5"></script>
<script src="assets/js/crew-store.js?v=1.9.5"></script>
<script src="assets/js/guards-store.js?v=1.9.5"></script>
<script src="assets/js/rivals-store.js?v=1.9.5"></script>
<script src="assets/js/pvp-model.js?v=1.9.5"></script>
<script src="assets/js/pvp.js?v=1.9.5"></script>
</body>
</html>
